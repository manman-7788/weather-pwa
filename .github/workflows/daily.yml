name: Fetch Weather Data

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Run fetch script
        run: |
          node -e "
          const fs = require('fs');
          
          async function run() {
            if (!fs.existsSync('./data')) fs.mkdirSync('./data');
            
            // 1. 抓取中央气象台 (NMC)
            try {
              const r = await fetch('https://www.nmc.cn/rest/weather?stationid=cqsJg');
              const d = (await r.json()).data;
              if(d) {
                fs.writeFileSync('./data/current.json', JSON.stringify(d, null, 2));
                
                // 历史数据记录逻辑保持不变
                const now = new Date();
                const pts = d.passedchart.filter(p => ['02','08','14','20'].includes(p.time.slice(11,13)));
                const avg = pts.length ? pts.reduce((a,c)=>a+c.temperature,0)/pts.length : d.real.weather.temperature;
                const rec = {
                  m: now.getUTCMonth() + 1, d: now.getUTCDate(),
                  avgTemp: Number(avg.toFixed(1)),
                  minTemp: Number(d.tempchart[0].min_temp),
                  maxTemp: Number(d.tempchart[0].max_temp),
                  rain: Number(d.passedchart.reduce((a,c)=>a+(c.rain1h||0),0).toFixed(1)),
                  maxWind: Number(Math.max(...d.passedchart.map(p=>p.wind_speed||0)).toFixed(1))
                };
                let history = [];
                if (fs.existsSync('./data/history.json')) history = JSON.parse(fs.readFileSync('./data/history.json', 'utf8'));
                const idx = history.findIndex(h => h.m === rec.m && h.d === rec.d);
                if (idx >= 0) history[idx] = rec; else history.push(rec);
                fs.writeFileSync('./data/history.json', JSON.stringify(history, null, 2));
              }
            } catch(e) { console.log('NMC error', e); }

            // 2. 抓取广东应急气象 (东莞 441900)
            try {
              // 注意：请替换为你申请到的真实 Key。如果测试 Key 有效，可保留默认值。
              const KEY = '0b9fdcc756a60ea59f82aa3a'; 
              const dgRes = await fetch(`http://open.gd121.cn/share/getData.do?type=json&code=441900&productType=FCST&key=${KEY}`);
              const dgJson = await dgRes.json();
              
              // 广东应急气象返回的数据结构可能是 { fcst: [...] } 或直接是数组
              // 这里写一个通用的提取逻辑
              let rawList = dgJson.fcst || dgJson.data || dgJson;
              if (!Array.isArray(rawList)) {
                // 如果是对象，尝试取出里面的数组
                const keys = Object.keys(dgJson);
                if (keys.length > 0 && Array.isArray(dgJson[keys[0]])) {
                  rawList = dgJson[keys[0]];
                }
              }

              if (Array.isArray(rawList) && rawList.length > 0) {
                let dgForecast = rawList.map((item, i) => {
                  // 尝试从各种可能的字段名中提取数据
                  const dateStr = item.date || item.fcstDate || item.time || '';
                  const text = item.weather || item.weatherDesc || item.info || '多云';
                  const min = item.minTemp || item.min_temp || item.low || 0;
                  const max = item.maxTemp || item.max_temp || item.high || 0;
                  
                  return {
                    d: i === 0 ? '今天' : (dateStr ? dateStr.slice(5) : ''),
                    icon: 'cloud',
                    text: text,
                    min: Number(min) || '--',
                    max: Number(max) || '--'
                  };
                });
                fs.writeFileSync('./data/dongguan.json', JSON.stringify(dgForecast, null, 2));
                console.log('广东应急气象抓取成功');
              } else {
                console.log('广东应急气象返回格式异常或为空');
              }
            } catch(e) { 
              console.log('广东应急气象 error', e); 
            }
          }
          run();
          "
      - name: Commit
        run: |
          git config --global user.name 'Auto-Bot'
          git config --global user.email 'bot@example.com'
          git add data/
          git commit -m "Update weather data" || exit 0
          git push
